<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charaing | 내 사이트 모음</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6C94E; --bg2:#F2B92E; --ink:#1d1a14; --card:#fff; --shadow:#e0a91f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
    background:var(--bg); color:var(--ink);
    overflow-x:hidden; position:relative;
  }
  /* 배경 큰 곡선 장식 */
  .blob{position:fixed;border-radius:50%;background:var(--bg2);opacity:.55;z-index:0;pointer-events:none}
  .b1{width:120vw;height:120vw;max-width:900px;max-height:900px;left:-55vw;top:-30vh}
  .b2{width:90vw;height:90vw;max-width:700px;max-height:700px;right:-45vw;bottom:-25vh}
  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:56px 20px 60px}

  header{text-align:center;margin-bottom:34px;position:relative}
  .avatar{
    width:112px;height:112px;border-radius:50%;margin:0 auto;
    background:#EBB2B2;display:grid;place-items:center;position:relative;
    font-weight:900;font-size:30px;color:#fff;letter-spacing:-1px;
    font-style:italic;text-shadow:0 2px 0 rgba(0,0,0,.08);
  }
  .badge{
    position:absolute;right:-74px;top:-14px;background:#111;color:#fff;
    border-radius:16px;padding:8px 13px;font-size:13px;font-weight:800;
    transform:rotate(6deg);white-space:nowrap;line-height:1.2;text-align:left;font-style:normal;
    box-shadow:0 4px 0 rgba(0,0,0,.15)
  }
  .badge small{display:block;color:#F6C94E;font-size:11px;font-weight:700}
  .badge:after{content:"";position:absolute;left:-7px;bottom:10px;border:8px solid transparent;border-right-color:#111;border-left:0}
  h1{font-size:19px;font-weight:700;margin-top:16px}
  .sub{font-size:13px;opacity:.65;margin-top:4px}

  .tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
  .tab{border:0;background:rgba(255,255,255,.45);padding:7px 14px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .tab.on{background:var(--ink);color:#fff}

  .list{display:flex;flex-direction:column;gap:14px}
  .link{
    display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);
    background:var(--card);border-radius:999px;padding:16px 22px;min-height:62px;
    box-shadow:0 5px 0 var(--shadow);transition:transform .12s, box-shadow .12s;
    position:relative;cursor:pointer;border:0;font:inherit;width:100%;text-align:left;
    animation:pop .4s both;
  }
  .link:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
  @media(hover:hover){.link:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--shadow)}}
  .emoji{font-size:24px;width:34px;text-align:center;flex-shrink:0}
  .txt{flex:1;min-width:0;text-align:center;padding-right:34px}
  .txt b{display:block;font-size:16px;font-weight:700}
  .txt span{display:block;font-size:12px;opacity:.55;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link.empty{opacity:.7}
  .link.empty .txt span{color:#c0392b;opacity:1}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}}

  footer{text-align:center;margin-top:36px;font-size:12px;opacity:.6}
  .gear{
    position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;
    width:50px;height:50px;border-radius:50%;border:0;background:var(--ink);color:#fff;
    font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)
  }

  /* 편집 시트 */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:11;background:#fff;border-radius:22px 22px 0 0;
    max-height:88vh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .25s,visibility .25s;visibility:hidden;max-width:560px;margin:0 auto
  }
  .open .sheet-bg{display:block}.open .sheet{transform:none;visibility:visible}
  .sheet h2{font-size:18px;margin-bottom:4px}
  .sheet p.h{font-size:12px;opacity:.6;margin-bottom:14px}
  .row{border:1px solid #eee;border-radius:14px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:52px 1fr;gap:8px}
  .row input,.row select{min-width:0;width:100%;border:1px solid #ddd;border-radius:9px;padding:9px 10px;font:inherit;font-size:14px;background:#fafafa}
  .row .full{grid-column:1/-1}
  .row .e{text-align:center;font-size:20px;padding:6px}
  .rowbtns{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
  .sm{border:0;background:#f1f1f1;border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
  .sm.del{color:#c0392b}
  .actions{display:flex;gap:8px;margin-top:8px;position:sticky;bottom:-24px;background:#fff;padding:10px 0}
  .big{flex:1;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:#f1f1f1}
  .big.go{background:var(--ink);color:#fff}
  .profile{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .profile input{min-width:0;width:100%;border:1px solid #ddd;border-radius:9px;padding:9px 10px;font:inherit;font-size:14px;background:#fafafa}
  .gh{border:1px dashed #ccc;border-radius:14px;padding:12px;margin-bottom:14px;font-size:12px}
  .gh b{font-size:13px}
  .gh input{width:100%;border:1px solid #ddd;border-radius:9px;padding:9px 10px;font:inherit;font-size:13px;background:#fafafa;margin-top:8px}
  .gh .st{margin-top:6px;opacity:.7}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:20;
    opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>

<div class="wrap">
  <header>
    <div class="avatar"><span id="avatarTxt">char</span>
      <div class="badge"><span id="badgeTxt">MADE BY ME</span><small id="badgeSub">since 2026</small></div>
    </div>
    <h1 id="handle">@charaing</h1>
    <div class="sub" id="bio">내가 만든 사이트 전부 여기 있음</div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main class="list" id="list"></main>
  <footer id="count"></footer>
</div>

<button class="gear" id="gear" aria-label="편집">✎</button>
<div class="toast" id="toast"></div>

<div id="editor">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet">
    <h2>링크 편집</h2>
    <p class="h">주소(URL)를 넣으면 버튼 누를 때 바로 열려. 깃허브 키가 있으면 저장할 때 바로 사이트에 반영돼.</p>
    <div class="gh">
      <b>🔑 깃허브 키</b> · 이 기기에만 저장되고 사이트에는 안 올라가
      <input id="ghToken" type="password" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="st" id="ghSt"></div>
    </div>
    <div class="profile">
      <input id="pHandle" placeholder="@아이디">
      <input id="pAvatar" placeholder="프로필 글자">
      <input id="pBio" placeholder="한 줄 소개" style="grid-column:1/-1">
    </div>
    <div id="rows"></div>
    <button class="sm" id="addBtn" style="width:100%;padding:12px;margin-top:4px">＋ 사이트 추가</button>
    <div class="actions">
      <button class="big" id="resetBtn">초기화</button>
      <button class="big go" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<script>
const CATS = ["게임","주식","도구"];
const DEFAULT = {
  handle:"@charaing", avatar:"char", bio:"내가 만든 사이트 전부 여기 있음",
  links:[
    {e:"💳", t:"마뗑킴 카드지갑 챌린지", d:"50문제 억까 퀴즈", c:"게임", u:"https://charaing.github.io/sadasdw2/"},
    {e:"🧬", t:"GENESIS LAB", d:"동물 교배·돌연변이 시뮬레이션", c:"게임", u:""},
    {e:"🛰️", t:"ZERO TRACE", d:"1대1 사이버 침투 전략 대전", c:"게임", u:""},
    {e:"🎰", t:"ROYAL TABLE", d:"카지노 테마 가상 포인트 게임", c:"게임", u:""},
    {e:"📈", t:"STOCK KING 주식의 신", d:"코스피 100종목 주식 시뮬레이터", c:"주식", u:""},
    {e:"💹", t:"REAL MARKET", d:"실시간 주식·코인 모의투자", c:"주식", u:""},
    {e:"🎵", t:"MUSIC STOCK", d:"노래를 종목처럼 사고파는 게임", c:"주식", u:""},
    {e:"🗓️", t:"WEEKLY", d:"5분 단위 주간 시간표", c:"도구", u:""},
    {e:"🥊", t:"BOXING VOICE COACH", d:"에어팟 음성 복싱 코치", c:"도구", u:""}
  ]
};
const KEY="charaing-linkhub-v1";
let data, filter="전체";

function load(){
  try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function store(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }

/* 깃허브 저장소 연동: links.json 을 읽고, 키가 있으면 저장 시 바로 커밋 */
const GH={owner:"Charaing", repo:"links", branch:"main", path:"links.json"};
const TKEY="charaing-gh-token";
const API=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
const getToken=()=>{ try{ return localStorage.getItem(TKEY)||""; }catch(e){ return ""; } };
const setToken=t=>{ try{ t?localStorage.setItem(TKEY,t):localStorage.removeItem(TKEY); }catch(e){} };
const ghHeaders=(extra={})=>{ const t=getToken(); return {...extra, ...(t?{Authorization:"Bearer "+t}:{})}; };
const b64=s=>{ const bytes=new TextEncoder().encode(s); let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin); };
let toastT;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2600); }

async function loadRemote(){
  // API 는 커밋 직후에도 최신, 실패하면 Pages 에 올라간 파일로
  try{
    const r=await fetch(API+"?ref="+GH.branch, {headers:ghHeaders({Accept:"application/vnd.github.raw+json"}), cache:"no-store"});
    if(r.ok) return await r.json();
  }catch(e){}
  try{
    const r=await fetch("links.json?t="+Date.now(), {cache:"no-store"});
    if(r.ok) return await r.json();
  }catch(e){}
  return null;
}
async function pushRemote(obj, retry=1){
  const h=ghHeaders({Accept:"application/vnd.github+json"});
  const cur=await fetch(API+"?ref="+GH.branch, {headers:h, cache:"no-store"});
  if(cur.status===401) throw new Error("키가 틀렸거나 만료됨");
  const sha=cur.ok ? (await cur.json()).sha : undefined;
  const r=await fetch(API, {method:"PUT", headers:{...h,"Content-Type":"application/json"}, body:JSON.stringify({
    message:"링크 업데이트", branch:GH.branch, sha,
    content:b64(JSON.stringify(obj,null,2)+"\n")
  })});
  if(r.status===409 && retry) return pushRemote(obj, retry-1);
  if(r.status===401) throw new Error("키가 틀렸거나 만료됨");
  if(r.status===403||r.status===404) throw new Error("키에 links 저장소 쓰기 권한이 없어");
  if(!r.ok) throw new Error("저장 실패 ("+r.status+")");
}
function ghStatus(){ ghSt.textContent = getToken() ? "✓ 키 저장됨 — 저장 누르면 사이트에 바로 반영" : "키 없으면 이 기기에만 저장돼"; }
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function render(){
  document.getElementById("handle").textContent=data.handle;
  document.getElementById("avatarTxt").textContent=data.avatar;
  document.getElementById("bio").textContent=data.bio;
  const tabs=["전체",...CATS.filter(c=>data.links.some(l=>l.c===c))];
  document.getElementById("tabs").innerHTML=tabs.map(t=>`<button class="tab ${t===filter?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  const items=data.links.filter(l=>filter==="전체"||l.c===filter);
  document.getElementById("list").innerHTML=items.map((l,i)=>{
    const ok=/^https?:\/\//.test(l.u);
    const inner=`<div class="emoji">${esc(l.e)}</div><div class="txt"><b>${esc(l.t)}</b><span>${ok?esc(l.d):"링크 아직 없음 · 눌러서 추가"}</span></div>`;
    return ok
      ? `<a class="link" style="animation-delay:${i*45}ms" href="${esc(l.u)}" target="_blank" rel="noopener">${inner}</a>`
      : `<button class="link empty" style="animation-delay:${i*45}ms" data-edit="1">${inner}</button>`;
  }).join("");
  const n=data.links.filter(l=>/^https?:\/\//.test(l.u)).length;
  document.getElementById("count").textContent=`사이트 ${data.links.length}개 · 링크 연결 ${n}개`;
}

document.getElementById("tabs").onclick=e=>{const b=e.target.closest(".tab"); if(b){filter=b.dataset.t; render();}};
document.getElementById("list").onclick=e=>{ if(e.target.closest("[data-edit]")) openEditor(); };

/* 편집기 */
let draft;
function rowsHTML(){
  return draft.links.map((l,i)=>`
    <div class="row">
      <input class="e" data-i="${i}" data-k="e" value="${esc(l.e)}">
      <input data-i="${i}" data-k="t" value="${esc(l.t)}" placeholder="이름">
      <input class="full" data-i="${i}" data-k="d" value="${esc(l.d)}" placeholder="설명">
      <input class="full" data-i="${i}" data-k="u" value="${esc(l.u)}" placeholder="https://..." inputmode="url" autocapitalize="off">
      <div class="rowbtns">
        <select data-i="${i}" data-k="c" style="width:auto">${CATS.map(c=>`<option ${c===l.c?"selected":""}>${c}</option>`).join("")}</select>
        <button class="sm" data-mv="-1" data-i="${i}">▲</button>
        <button class="sm" data-mv="1" data-i="${i}">▼</button>
        <button class="sm del" data-del="${i}">삭제</button>
      </div>
    </div>`).join("");
}
function openEditor(){
  draft=JSON.parse(JSON.stringify(data));
  pHandle.value=draft.handle; pAvatar.value=draft.avatar; pBio.value=draft.bio;
  ghToken.value=getToken(); ghStatus();
  rows.innerHTML=rowsHTML();
  editor.classList.add("open");
}
function closeEditor(){ editor.classList.remove("open"); }
rows.oninput=rows.onchange=e=>{const el=e.target; if(el.dataset.k) draft.links[+el.dataset.i][el.dataset.k]=el.value.trim();};
rows.onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.del!==undefined){ draft.links.splice(+b.dataset.del,1); }
  else if(b.dataset.mv){ const i=+b.dataset.i, j=i+ +b.dataset.mv; if(j<0||j>=draft.links.length) return; [draft.links[i],draft.links[j]]=[draft.links[j],draft.links[i]]; }
  rows.innerHTML=rowsHTML();
};
addBtn.onclick=()=>{ draft.links.push({e:"✨",t:"새 사이트",d:"",c:"게임",u:""}); rows.innerHTML=rowsHTML(); rows.lastElementChild.scrollIntoView({behavior:"smooth"}); };
ghToken.onchange=()=>{ setToken(ghToken.value.trim()); ghStatus(); };
saveBtn.onclick=async()=>{
  draft.handle=pHandle.value.trim()||"@me"; draft.avatar=pAvatar.value.trim()||"me"; draft.bio=pBio.value.trim();
  draft.links.forEach(l=>{ if(l.u && !/^https?:\/\//.test(l.u)) l.u="https://"+l.u; });
  setToken(ghToken.value.trim());
  data=draft; store(); render(); closeEditor();
  if(!getToken()){ toast("이 기기에만 저장됨"); return; }
  toast("깃허브에 올리는 중…");
  try{ await pushRemote(data); toast("✓ 사이트에 반영됨"); }
  catch(e){ toast("⚠ "+e.message); }
};
let resetArm=0;
resetBtn.onclick=()=>{
  if(!resetArm){ resetArm=1; resetBtn.textContent="한 번 더 누르면 초기화"; setTimeout(()=>{resetArm=0;resetBtn.textContent="초기화";},2500); return; }
  resetArm=0; resetBtn.textContent="초기화";
  data=JSON.parse(JSON.stringify(DEFAULT)); store(); render(); closeEditor();
};
sheetBg.onclick=closeEditor;
gear.onclick=openEditor;

data=load(); render();
loadRemote().then(r=>{ if(r && Array.isArray(r.links)){ data=r; store(); render(); } });
</script>
</body>
</html>
